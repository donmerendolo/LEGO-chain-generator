# Publishes the board to GitHub Pages on every push to main, but only if the
# maths still checks out. Turn it on once under Settings → Pages by setting
# Source to "GitHub Actions".
#
# There is nothing to build: the site is the files themselves. They are copied
# into _site rather than published from the root so that what goes public is a
# list you can read, and .git and the LDraw download cache stay out of it.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push makes an older one pointless.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read test.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir _site
          cp index.html *.js _site/
          cp -r img _site/
      - uses: actions/upload-pages-artifact@v3
      - id: pages
        uses: actions/deploy-pages@v4
